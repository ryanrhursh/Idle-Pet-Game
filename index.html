<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9ad7ff" />
    <meta name="description" content="A cozy 3D idle town where the pets you collect are the citizens." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pawville" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Pawville</title>
  </head>
  <body>
    <div id="viewport"></div>
    <header id="hud"></header>
    <div id="toasts"></div>
    <div id="banner" hidden></div>
    <aside id="sheet" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body"></div>
    </aside>
    <nav id="tabs">
      <button data-tab="build"><span>🏗️</span>Build</button>
      <button data-tab="pets"><span>🐾</span>Pets</button>
      <button data-tab="hatch"><span>🥚</span>Hatch</button>
      <button data-tab="dex"><span>📖</span>Petdex</button>
      <button data-tab="menu"><span>⚙️</span>Menu</button>
    </nav>
    <div id="modal" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
